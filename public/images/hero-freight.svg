<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#0B0F17"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.1"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F8FAFC" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Cargo Container Silhouette -->
  <rect x="200" y="250" width="800" height="300" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="4"/>
